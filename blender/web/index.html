<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baits Flow Crunch 3D</title>
<style>
  :root { --bg: #f1f1f2; --ink: #4a0f14; --muted: #8a6a70; }
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: system-ui, -apple-system, sans-serif; color: var(--ink); overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  button { border: 0; border-radius: 999px; padding: 9px 16px; background: var(--ink); color: #fff; font: 600 13px system-ui; cursor: pointer; }
  button.ghost { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #hint { position: fixed; right: 16px; bottom: 20px; font-size: 12px; color: var(--muted); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div id="loading">Carregando caixa 3D…</div>
<div id="ui">
  <button data-view="hero">Frente (foto)</button>
  <button class="ghost" data-view="q34">3/4</button>
  <button class="ghost" data-view="side">Lateral</button>
  <button class="ghost" data-view="back">Verso</button>
  <button class="ghost" data-view="top">Topo</button>
  <button class="ghost" id="spin">Girar</button>
</div>
<div id="hint">Arraste para girar · scroll para zoom</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;          // keep printed colours as in the Blender "Standard" render
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf1f1f2);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Hero camera from Blender: 85.5 mm lens, 36 mm sensor width, 1.38 m away, 0.418 m high (vertical FOV for 16:9)
const camera = new THREE.PerspectiveCamera(13.5, innerWidth / innerHeight, 0.05, 50);
const target = new THREE.Vector3(0, 0.1255, 0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.copy(target);
controls.minDistance = 0.35; controls.maxDistance = 4; controls.maxPolarAngle = Math.PI / 2 - 0.02;

// Even, shadow-free lighting so every printed face reads clearly (white hemisphere ~ prints at its own colour)
scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, 1.62));
const key = new THREE.DirectionalLight(0xffffff, 0.38);   // gentle modelling light from front-left, no shadows
key.position.set(-1.2, 1.0, 1.4); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.3);
rim.position.set(1.2, 0.8, -1.4); scene.add(rim);

new GLTFLoader().load('baits_box.glb', (gltf) => {
  gltf.scene.traverse((o) => {
    if (o.isMesh) {
            const m = o.material;
      if (m.map) { m.map.anisotropy = renderer.capabilities.getMaxAnisotropy(); }
      m.envMapIntensity = 0.25;
      if (m.map) { m.map.generateMipmaps = true; m.map.minFilter = THREE.LinearMipmapLinearFilter; }
    }
  });
  scene.add(gltf.scene);
  document.getElementById('loading').remove();
}, undefined, (e) => { document.getElementById('loading').textContent = 'Erro ao carregar o modelo: ' + e.message; });

const views = {
  hero: [0, 0.418, 1.381],
  q34:  [0.85, 0.75, 1.15],
  side: [1.45, 0.32, 0.0],
  back: [0, 0.418, -1.381],
  top:  [0.05, 1.45, 0.45],
};
let tween = null, spinning = false;
function go(name) {
  const from = camera.position.clone(), to = new THREE.Vector3(...views[name]);
  const t0 = performance.now();
  tween = (now) => {
    const k = Math.min(1, (now - t0) / 900), e = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
    camera.position.lerpVectors(from, to, e); controls.target.copy(target);
    if (k === 1) tween = null;
  };
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('ghost', b.dataset.view !== name));
}
camera.position.set(...views.hero);
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => go(b.dataset.view));
const spinBtn = document.getElementById('spin');
spinBtn.onclick = () => { spinning = !spinning; controls.autoRotate = spinning; controls.autoRotateSpeed = 2; spinBtn.classList.toggle('ghost', !spinning); };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop((now) => {
  if (tween) tween(now);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
